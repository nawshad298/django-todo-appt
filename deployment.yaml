$ sudo nano django-todo-appt.yml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-deployment
  labels:
    app: todo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
      - name: todo-container
        image: nawshad298/django-todo-app:latest # Using a pre-built reliable image
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: todo-service
spec:
  type: NodePort
  selector:
    app: todo
  ports:
    - protocol: TCP
      port: 81          # Port inside the cluster
      targetPort: 8001  # Port the container is listening on
      nodePort: 30008   # Port accessible from your browser



$ kubectl create -f django-todo-appt.yml
$ kubectl get deployments.app todo-deployment
$ kubectl get svc

$ kubectl delete deployment todo-deployment 
$ kubectl delete svc todo-service 
$ kubectl get pods
